# nginx.conf - Configuration Nginx pour reverse proxy
# À ajouter à votre docker-compose si besoin

events {
    worker_connections 1024;
}

http {
    # Compression gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Reverse proxy vers votre application
    upstream app_backend {
        server harmony_app:8000;
    }

    upstream prometheus_backend {
        server harmony_prometheus:9090;
    }

    upstream grafana_backend {
        server harmony_grafana:3000;
    }

    upstream loki_backend {
        server harmony_loki:3100;
    }

    # Serveur principal
    server {
        listen 80;
        server_name localhost;

        # Application principale
        location / {
            proxy_pass http://app_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Prometheus
        location /prometheus/ {
            proxy_pass http://prometheus_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Grafana
        location /grafana/ {
            proxy_pass http://grafana_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Loki
        location /loki/ {
            proxy_pass http://loki_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Healthcheck
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}