# promtail-config.yml - Configuration Promtail
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

client:
  url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Scraper les logs de votre application
  - job_name: harmony_app
    static_configs:
      - targets: [localhost]
        labels:
          job: harmony_app
          service: web
          __path__: /var/lib/docker/containers/*/*.log
    pipeline_stages:
      - docker: {}
      - regex:
          expression: '.*"method":"(?P<method>[^"]+)".*"status":(?P<status>\d+).*"duration":(?P<duration>\d+)'
      - labels:
          method: ""
          status: ""

  # Scraper les logs de Docker
  - job_name: docker_logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 10s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      - source_labels: ['__meta_docker_container_label_com_docker_compose_project']
        target_label: compose_project
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: compose_service

  # Scraper les logs système
  - job_name: system
    static_configs:
      - targets: [localhost]
        labels:
          job: system
          __path__: /var/log/*.log
    pipeline_stages:
      - regex:
          expression: '(?P<level>[A-Z]+): (?P<message>.*)'
      - labels:
          level: ""

  # Scraper les logs Nginx (si actif)
  - job_name: nginx_logs
    static_configs:
      - targets: [localhost]
        labels:
          job: nginx
          __path__: /var/log/nginx/*.log